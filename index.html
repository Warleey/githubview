<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="githubview — visualize estatísticas, repositórios recentes e as linguagens mais usadas de qualquer perfil do GitHub em tempo real."
    />
    <meta name="theme-color" content="#010409" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>githubview · Explore perfis do GitHub</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (padrão: dark)
      try {
        if (localStorage.getItem("githubview:theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (error) {
        // Em ambientes sem localStorage mantém o padrão dark
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
